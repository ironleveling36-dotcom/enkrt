services:
  - type: web
    name: lenskart-bot
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
        description: "Your Telegram Bot Token from @BotFather"
      - key: CHANNEL_ID
        sync: false
        description: "Telegram Channel ID (e.g., -1001234567890)"
      - key: ADMIN_IDS
        sync: false
        description: "Comma-separated admin user IDs (e.g., 123456,789012)"
      - key: RENDER_URL
        fromService:
          name: lenskart-bot
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TZ
        value: Asia/Kolkata
      - key: DB_PATH
        value: /data/bot_data.db
    persistentDisk:
      sizeGB: 1
      mountPath: /data
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
